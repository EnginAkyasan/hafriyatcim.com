<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>İlan Detayı — hafriyatcim.com</title>
    <meta name="description" content="Hafriyat ve nakliye ilanı detayları. Teklif verin veya işi kabul edin.">
    <link rel="icon" href="logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --orange: #f59e0b;  /* amber-500 */
            --orange-d: #d97706; /* amber-600 */
            --orange-glow: rgba(245,158,11,0.08);
            --bg: #09090b; --card: #18181b; --card2: rgba(39,39,42,0.8);
            --border: #27272a;
            --text: #f4f4f5; --muted: #a1a1aa; --dim: #52525b;
            --success: #16a34a; --danger: #dc2626; --warn: #d97706;
            --r: 6px; --rs: 4px;
        }
        body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
               min-height:100vh; padding-bottom:100px; }

        /* ─── Top Nav ─── */
        .topbar { display:flex; align-items:center; gap:12px; padding:0 20px;
                  height:52px;
                  border-bottom:1px solid var(--border); background:var(--bg);
                  position:sticky; top:0; z-index:50; }
        .back { width:32px; height:32px; border:1px solid var(--border); border-radius:var(--rs);
                background:var(--card); color:var(--muted); font-size:14px; cursor:pointer;
                display:flex; align-items:center; justify-content:center; text-decoration:none;
                transition:border-color .15s, color .15s; }
        .back:hover { border-color:var(--border-hover, #3f3f46); color:var(--text); }
        .topbar-title { font-weight:700; font-size:.95rem; }
        .topbar-sub   { font-size:.78rem; color:var(--muted); }
        .topbar-logo  { margin-left:auto; font-weight:800; font-size:.9rem; }
        .topbar-logo span { color:var(--orange); }

        /* ─── Layout ─── */
        .page { max-width:900px; margin:0 auto; padding:20px 16px; display:grid;
                grid-template-columns:1fr 340px; gap:20px; }
        @media(max-width:720px){ .page { grid-template-columns:1fr; } }

        /* ─── Cards ─── */
        .card { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:20px; }
        .card + .card { margin-top:16px; }
        .card-label { font-size:.72rem; font-weight:700; color:var(--muted);
                      text-transform:uppercase; letter-spacing:.08em; margin-bottom:14px; }

        /* ─── İlan Başlık ─── */
        .ilan-hero { background:var(--card);
                     border:1px solid var(--border); border-radius:var(--r); padding:24px;
                     position:relative; overflow:hidden; }
        .ilan-status { display:inline-flex; align-items:center; gap:6px;
                       background:rgba(22,163,74,0.1); border:1px solid rgba(22,163,74,0.25);
                       color:var(--success); border-radius:var(--rs); padding:3px 10px;
                       font-size:11px; font-weight:600; margin-bottom:14px; }
        .ilan-status.kapali { background:rgba(239,68,68,0.1); border-color:rgba(239,68,68,0.25); color:var(--danger); }
        .status-dot { width:6px; height:6px; border-radius:50%; background:currentColor; animation:pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .ilan-title { font-size:1.4rem; font-weight:800; line-height:1.3; margin-bottom:8px; }
        .ilan-meta  { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
        .ilan-tag { display:flex; align-items:center; gap:5px; background:var(--card2);
                    border:1px solid var(--border); border-radius:8px; padding:6px 12px;
                    font-size:.82rem; font-weight:500; }

        /* ─── Rota Görseli ─── */
        .route-visual { display:flex; align-items:center; gap:0; margin:20px 0; }
        .route-node { display:flex; flex-direction:column; gap:4px; }
        .route-label { font-size:.7rem; color:var(--muted); font-weight:600; text-transform:uppercase; }
        .route-val   { font-size:.95rem; font-weight:700; }
        .route-line  { flex:1; height:2px; background:linear-gradient(90deg,var(--orange),transparent);
                       margin:0 12px; position:relative; top:8px; }
        .route-arrow { color:var(--orange); font-size:1.2rem; margin:0 4px; position:relative; top:6px; }

        /* ─── Detay Grid ─── */
        .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0; }
        @media(max-width:400px){ .detail-grid { grid-template-columns:1fr; } }
        .detail-item { background:var(--card2); border:1px solid var(--border);
                       border-radius:var(--rs); padding:14px; }
        .detail-item .d-label { font-size:.72rem; color:var(--muted); margin-bottom:4px; }
        .detail-item .d-val   { font-size:1rem; font-weight:700; }
        .detail-item .d-val.price { color:var(--orange); font-size:1.1rem; }

        /* ─── Açıklama ─── */
        .aciklama-box { background:var(--card2); border:1px solid var(--border);
                        border-radius:var(--rs); padding:16px; margin-top:12px;
                        font-size:.9rem; color:var(--muted); line-height:1.7; }

        /* ─── Teklifler ─── */
        .teklif-card { display:flex; align-items:center; gap:14px; padding:14px;
                       background:var(--card2); border:1px solid var(--border);
                       border-radius:var(--rs); margin-bottom:10px; transition:.2s; }
        .teklif-card:hover { border-color:#3f3f46; }
        .teklif-avatar { width:36px; height:36px; border-radius:var(--rs);
                         background:var(--card);
                         border: 1px solid var(--border);
                         display:flex; align-items:center; justify-content:center;
                         font-size:13px; font-weight:700; flex-shrink:0; color:var(--text); }
        .teklif-info  { flex:1; min-width:0; }
        .teklif-name  { font-size:.9rem; font-weight:700; margin-bottom:2px; }
        .teklif-meta  { font-size:.77rem; color:var(--muted); }
        .teklif-price { font-size:1rem; font-weight:800; color:var(--orange); }
        .teklif-stars { color:#f59e0b; font-size:.75rem; letter-spacing:-.5px; }

        .kabul-btn { background:var(--orange);
                     border:none; border-radius:var(--rs); padding:7px 13px;
                     color:#000; font-family:inherit; font-size:12px; font-weight:600;
                     cursor:pointer; white-space:nowrap;
                     transition:background .15s; }
        .kabul-btn:hover { background:var(--orange-d); }
        .kabul-btn:disabled { opacity:.5; cursor:not-allowed; }

        /* ─── Teklif Ver Formu (Tırcı) ─── */
        .teklif-form { display:flex; flex-direction:column; gap:14px; }
        .form-label { font-size:.8rem; font-weight:600; color:var(--muted); margin-bottom:6px; display:block; }
        .form-input, .form-textarea {
            width:100%; background:var(--card2); border:1px solid var(--border);
            border-radius:var(--rs); padding:9px 12px; color:var(--text);
            font-family:inherit; font-size:13px; outline:none;
            transition:border-color .15s; }
        .form-input:focus, .form-textarea:focus {
            border-color:var(--orange); }
        .form-textarea { resize:vertical; min-height:80px; }
        .price-input-wrap { position:relative; }
        .price-input-wrap .form-input { padding-right:40px; }
        .price-suffix { position:absolute; right:12px; top:50%; transform:translateY(-50%);
                        color:var(--muted); font-weight:700; }

        .submit-btn { width:100%; background:var(--orange);
                      border:none; border-radius:var(--rs); padding:11px;
                      color:#000; font-family:inherit; font-size:13px; font-weight:700;
                      cursor:pointer; transition:background .15s; }
        .submit-btn:hover { background:var(--orange-d); }
        .submit-btn:disabled { opacity:.5; cursor:not-allowed; }

        /* İşi ver butonu (sağ kolon) */
        .isi-ver-btn { width:100%; background:var(--success);
                       border:none; border-radius:var(--rs); padding:11px;
                       color:#fff; font-family:inherit; font-size:13px; font-weight:700;
                       cursor:pointer; transition:background .15s; margin-top:12px; }
        .isi-ver-btn:hover { background:#15803d; }

        /* ─── Platform Ücreti Uyarısı ─── */
        .fee-notice { display:flex; gap:10px; padding:14px; background:rgba(249,115,22,.07);
                      border:1px solid rgba(249,115,22,.2); border-radius:var(--rs);
                      font-size:.82rem; line-height:1.5; }
        .fee-notice .fee-icon { font-size:1.1rem; flex-shrink:0; margin-top:1px; }

        /* ─── Profil kartı ─── */
        .musteri-card { display:flex; align-items:center; gap:12px; padding:14px;
                        background:var(--card2); border:1px solid var(--border); border-radius:var(--rs); }
        .musteri-avatar { width:36px; height:36px; border-radius:var(--rs);
                          background:var(--card);
                          border:1px solid var(--border);
                          display:flex; align-items:center; justify-content:center;
                          font-size:13px; font-weight:700; color:var(--text); }
        .musteri-info h4 { font-size:.92rem; font-weight:700; margin-bottom:2px; }
        .musteri-info p  { font-size:.78rem; color:var(--muted); }

        /* ─── Empty State ─── */
        .empty-state { text-align:center; padding:32px 16px; color:var(--muted); }
        .empty-state .e-icon { font-size:2.5rem; margin-bottom:10px; }
        .empty-state p { font-size:.88rem; line-height:1.6; }

        /* ─── Loading ─── */
        .loading-card { display:flex; align-items:center; justify-content:center;
                        padding:60px; color:var(--muted); gap:12px; }
        .spinner { width:20px; height:20px; border:2px solid var(--border);
                   border-top-color:var(--orange); border-radius:50%;
                   animation:spin .7s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* ─── Toast ─── */
        #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(100px);
                 background:var(--card); border:1px solid var(--border); border-radius:4px;
                 padding:9px 18px; font-size:13px; font-weight:500; z-index:9999;
                 transition:transform .2s ease;
                 max-width:calc(100vw - 32px); text-align:center; }
        #toast.show { transform:translateX(-50%) translateY(0); }
        #toast.success { border-color:rgba(34,197,94,.4); color:var(--success); }
        #toast.error   { border-color:rgba(239,68,68,.4);  color:var(--danger); }

        /* ─── Mobil Bottom Fix ─── */
        .sticky-bottom { position:fixed; bottom:0; left:0; right:0;
                         background:var(--bg); border-top:1px solid var(--border);
                         padding:12px 16px; display:none; z-index:40; }
        @media(max-width:720px){ .sticky-bottom { display:block; } }
    </style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
    <a href="javascript:history.back()" class="back">←</a>
    <div>
        <div class="topbar-title" id="topbarTitle">İlan Detayı</div>
        <div class="topbar-sub" id="topbarSub">Yükleniyor...</div>
    </div>
    <div class="topbar-logo">hafriyatcim<span>.com</span></div>
</div>

<!-- İçerik -->
<div class="page" id="pageContent">
    <div class="loading-card" style="grid-column:1/-1;">
        <div class="spinner"></div>
        <span>İlan yükleniyor...</span>
    </div>
</div>

<!-- Mobil Sticky Buton -->
<div class="sticky-bottom" id="stickyBottom"></div>

<div id="toast"></div>

<script src="api.js"></script>
<script>
// ─── Global Durum ─────────────────────────────────────────────────────────
let ilan = null;
let currentUser = null;
let selectedTeklifId = null;

// ─── Başlangıç ────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    const ilanId = params.get('id');
    if (!ilanId) { window.location.href = '/ilanlar.html'; return; }

    // Kullanıcı bilgisi
    try {
        const userStr = localStorage.getItem('user');
        if (userStr) currentUser = JSON.parse(userStr);
        // Token varsa taze kullanıcı bilgisi al
        if (localStorage.getItem('accessToken')) {
            const r = await fetch('/api/auth/ben', { headers:{ Authorization:`Bearer ${localStorage.getItem('accessToken')}` }});
            if (r.ok) { const d = await r.json(); currentUser = d.kullanici; localStorage.setItem('user', JSON.stringify(d.kullanici)); }
        }
    } catch {}

    await loadIlan(ilanId);
});

// ─── İlan Yükle ───────────────────────────────────────────────────────────
async function loadIlan(id) {
    try {
        const r = await fetch(`/api/ilanlar/${id}`);
        if (!r.ok) { showError(); return; }
        ilan = await r.json();

        document.title = `${ilan.baslik || 'İlan Detayı'} — hafriyatcim.com`;
        document.getElementById('topbarTitle').textContent = ilan.baslik || 'İlan Detayı';
        document.getElementById('topbarSub').textContent   = `${ilan.konum_dan} → ${ilan.konum_a}`;

        renderPage();
    } catch (err) {
        console.error(err);
        showError();
    }
}

// ─── Sayfa Render ─────────────────────────────────────────────────────────
function renderPage() {
    const isMusteri = currentUser && currentUser.id === ilan.user_id;
    const isSurucu  = currentUser && currentUser.rol === 'SURUCU';
    const isAktif   = ilan.durum === 'AKTIF';

    const yukEmoji = { toprak:'🟤', kum:'🟡', cakil:'⚪', moloz:'🧱',
                       hafriyat:'🏗️', beton:'🔘', asfalt:'⬛', diger:'📦' };
    const emoji = yukEmoji[ilan.yuk_turu] || '📦';

    document.getElementById('pageContent').innerHTML = `
    <!-- Sol Kolon -->
    <div class="left-col">

        <!-- İlan Hero -->
        <div class="ilan-hero">
            <div class="ilan-status ${isAktif?'':'kapali'}">
                <div class="status-dot"></div>
                ${isAktif ? 'Aktif İlan' : ilan.durum === 'KAPALI' ? 'Kapandı' : ilan.durum}
            </div>
            <div class="ilan-title">${emoji} ${ilan.baslik || `${ilan.yuk_turu} Taşıma`}</div>

            <!-- Rota -->
            <div class="route-visual">
                <div class="route-node">
                    <div class="route-label">📍 Nereden</div>
                    <div class="route-val">${ilan.konum_dan || '—'}</div>
                </div>
                <div class="route-line"></div>
                <div class="route-arrow">→</div>
                <div class="route-node">
                    <div class="route-label">🏁 Nereye</div>
                    <div class="route-val">${ilan.konum_a || '—'}</div>
                </div>
            </div>

            <!-- Etiketler -->
            <div class="ilan-meta">
                <div class="ilan-tag">${emoji} ${ilan.yuk_turu?.charAt(0).toUpperCase() + ilan.yuk_turu?.slice(1)}</div>
                <div class="ilan-tag">📦 ${ilan.miktar} ${ilan.birim || 'ton'}</div>
                ${ilan.baslama_tarihi ? `<div class="ilan-tag">📅 ${new Date(ilan.baslama_tarihi).toLocaleDateString('tr-TR')}</div>` : ''}
                <div class="ilan-tag">💬 ${ilan.teklif_sayisi || 0} Teklif</div>
            </div>
        </div>

        <!-- Detay Grid -->
        <div class="card">
            <div class="card-label">📊 İlan Detayları</div>
            <div class="detail-grid">
                <div class="detail-item">
                    <div class="d-label">Taşıma Ücreti (ton başı)</div>
                    <div class="d-val price">${parseFloat(ilan.fiyat || 0).toLocaleString('tr-TR')} ₺</div>
                </div>
                <div class="detail-item">
                    <div class="d-label">Toplam Miktar</div>
                    <div class="d-val">${ilan.miktar} ${ilan.birim || 'ton'}</div>
                </div>
                <div class="detail-item">
                    <div class="d-label">Tahmini Toplam</div>
                    <div class="d-val">${((ilan.fiyat||0) * (ilan.miktar||0)).toLocaleString('tr-TR')} ₺</div>
                </div>
                <div class="detail-item">
                    <div class="d-label">İlan Tarihi</div>
                    <div class="d-val">${ilan.created_at ? new Date(ilan.created_at).toLocaleDateString('tr-TR') : '—'}</div>
                </div>
            </div>

            ${ilan.aciklama ? `
            <div class="aciklama-box">
                <strong style="color:var(--text);font-size:.85rem;">📝 Açıklama:</strong><br>
                ${ilan.aciklama}
            </div>` : ''}
        </div>

        <!-- İlan Sahibi -->
        <div class="card">
            <div class="card-label">👤 İlan Sahibi</div>
            <div class="musteri-card">
                <div class="musteri-avatar">${(ilan.musteri_ad||'?')[0].toUpperCase()}</div>
                <div class="musteri-info">
                    <h4>${ilan.musteri_ad || 'İnşaat Firması'}</h4>
                    <p>🏗️ İnşaat / Hafriyat Müşterisi</p>
                </div>
            </div>
        </div>

        <!-- Teklifler (ilan sahibine göster) -->
        ${isMusteri ? renderTekliflerMusteri() : ''}
    </div>

    <!-- Sağ Kolon -->
    <div class="right-col">

        <!-- Tırcı: Teklif Ver -->
        ${isSurucu && isAktif && !isMusteri ? renderTeklifVer() : ''}

        <!-- Müşteri: Platform Ücreti Bilgi -->
        ${isMusteri && isAktif ? `
        <div class="card">
            <div class="card-label">💰 Eşleşme Ücreti</div>
            <div class="fee-notice">
                <div class="fee-icon">💡</div>
                <div>Beğendiğiniz tırcıya <strong>"İşi Ver"</strong> dediğinizde <strong>252 ₺ + KDV</strong> platform ücreti alınır.
                Tırcı da kabul edince her iki tarafın telefon numarası paylaşılır.</div>
            </div>
        </div>` : ''}

        <!-- Giriş yapılmamış -->
        ${!currentUser ? `
        <div class="card">
            <div class="card-label">🔐 Teklif Vermek İçin</div>
            <p style="color:var(--muted);font-size:.88rem;margin-bottom:14px;">
                Tırcıysanız teklif vermek için giriş yapın. <strong>Ücretsiz!</strong>
            </p>
            <a href="/giris.html#kayit-tir" style="display:block;text-align:center;background:linear-gradient(135deg,#f97316,#ea6c0a);
               color:#fff;border-radius:12px;padding:13px;font-weight:700;text-decoration:none;font-size:.95rem;">
                🚛 Tırcı Olarak Kayıt Ol
            </a>
            <a href="/giris.html" style="display:block;text-align:center;color:var(--muted);
               margin-top:10px;font-size:.85rem;text-decoration:none;">
                Zaten hesabım var →
            </a>
        </div>` : ''}

        <!-- İlan Bilgileri Özet -->
        <div class="card">
            <div class="card-label">📌 Hızlı Bilgi</div>
            <div style="display:flex;flex-direction:column;gap:10px;">
                <div style="display:flex;justify-content:space-between;font-size:.88rem;">
                    <span style="color:var(--muted);">Durum</span>
                    <span style="font-weight:600;color:${isAktif?'var(--success)':'var(--danger)'}">
                        ${isAktif ? '● Aktif' : '● Kapandı'}</span>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:.88rem;">
                    <span style="color:var(--muted);">Teklif Sayısı</span>
                    <span style="font-weight:600;">${ilan.teklif_sayisi || 0}</span>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:.88sm;">
                    <span style="color:var(--muted);">Yük Türü</span>
                    <span style="font-weight:600;">${emoji} ${ilan.yuk_turu}</span>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:.88rem;">
                    <span style="color:var(--muted);">Ton Başı Fiyat</span>
                    <span style="font-weight:700;color:var(--orange);">${parseFloat(ilan.fiyat||0).toLocaleString('tr-TR')} ₺</span>
                </div>
            </div>
        </div>

    </div>`;

    // Mobil sticky buton
    const sb = document.getElementById('stickyBottom');
    if (isSurucu && isAktif && !isMusteri) {
        sb.innerHTML = `<button class="submit-btn" onclick="scrollToForm()" style="margin:0;">🚛 Teklif Ver — Ücretsiz</button>`;
    } else if (isMusteri && isAktif) {
        sb.innerHTML = `<div style="font-size:.8rem;text-align:center;color:var(--muted);">İlan aktif — teklifleri yukarıdan inceleyin</div>`;
    }
}

function renderTekliflerMusteri() {
    const teklifler = ilan.teklifler || [];
    if (teklifler.length === 0) {
        return `<div class="card">
            <div class="card-label">💼 Gelen Teklifler (${teklifler.length})</div>
            <div class="empty-state">
                <div class="e-icon">📭</div>
                <p>Henüz teklif yok.<br>Tırcılar ilan gördükçe teklif verecek!</p>
            </div>
        </div>`;
    }

    const teklifHtml = teklifler.map(t => `
    <div class="teklif-card" id="teklif-${t.id}">
        <div class="teklif-avatar">${(t.surucu_ad||'T')[0]}</div>
        <div class="teklif-info">
            <div class="teklif-name">${t.surucu_ad || 'Tırcı'}</div>
            <div class="teklif-stars">${'⭐'.repeat(Math.round(t.surucu_rating||4.5)).slice(0,5) || '⭐⭐⭐⭐⭐'}</div>
            <div class="teklif-meta">${t.arac_bilgisi ? `🚛 ${t.arac_bilgisi}` : '🚛 Tır'}</div>
            ${t.mesaj ? `<div class="teklif-meta" style="margin-top:4px;font-style:italic;">"${t.mesaj}"</div>` : ''}
        </div>
        <div style="text-align:right;flex-shrink:0;">
            <div class="teklif-price">${parseFloat(t.fiyat||0).toLocaleString('tr-TR')} ₺</div>
            <div style="font-size:.72rem;color:var(--muted);margin-bottom:8px;">/ ton</div>
            ${t.durum === 'BEKLIYOR' && ilan.durum === 'AKTIF'
                ? `<button class="kabul-btn" onclick="isiVer('${t.id}','${t.surucu_ad||'Tırcı'}','${t.fiyat}')">✅ İşi Ver</button>`
                : `<span style="font-size:.75rem;color:${t.durum==='KABUL'?'var(--success)':'var(--muted)'}">
                    ${t.durum === 'KABUL' ? '✅ Kabul Edildi' : t.durum === 'RED' ? '❌ Reddedildi' : t.durum}</span>`
            }
        </div>
    </div>`).join('');

    return `<div class="card">
        <div class="card-label">💼 Gelen Teklifler (${teklifler.length})</div>
        ${teklifHtml}
    </div>`;
}

function renderTeklifVer() {
    return `<div class="card" id="teklifVerCard">
        <div class="card-label">💸 Teklif Ver — Ücretsiz</div>

        <div class="fee-notice" style="margin-bottom:16px;">
            <div class="fee-icon">ℹ️</div>
            <div>Teklif vermek <strong>ücretsiz!</strong> İş sahibi teklifinizi kabul edip ödeme yaparsa
            siz de <strong>252 ₺</strong> ödeyerek iletişim bilgilerini alırsınız.</div>
        </div>

        <div class="teklif-form">
            <div>
                <label class="form-label">Fiyat Teklifiniz (ton başı) *</label>
                <div class="price-input-wrap">
                    <input type="number" class="form-input" id="teklifFiyat"
                           placeholder="${Math.round(ilan.fiyat * 0.9) || 500}" min="1" required>
                    <span class="price-suffix">₺</span>
                </div>
                <div style="font-size:.72rem;color:var(--muted);margin-top:4px;">
                    İlan fiyatı: ${parseFloat(ilan.fiyat||0).toLocaleString('tr-TR')} ₺/ton
                </div>
            </div>

            <div>
                <label class="form-label">Toplam Taşıma Bedeli (₺) <span style="color:#8a8996;font-size:.72rem;">(opsiyonel)</span></label>
                <div class="price-input-wrap">
                    <input type="number" class="form-input" id="seferBedeli" placeholder="Ör: 30000" min="1">
                    <span class="price-suffix">₺</span>
                </div>
                <div style="font-size:.72rem;color:var(--muted);margin-top:5px;" id="ildKomisyon">
                    Platform komisyonu her taraftan: min. 252 ₺ veya bedelin %1'i
                </div>
            </div>

            <div>
                <label class="form-label">Araç Bilgisi</label>
                <input type="text" class="form-input" id="teklifArac"
                       placeholder="Ör: Ford Cargo 2520, 20 ton">
            </div>

            <div>
                <label class="form-label">Mesajınız (opsiyonel)</label>
                <textarea class="form-textarea" id="teklifMesaj"
                          placeholder="Ör: Araç hazır, yarın başlayabilirim. 3 araçlık kapasitem var."></textarea>
            </div>

            <button class="submit-btn" id="teklifSubmit" onclick="submitTeklif()">
                🚛 Teklif Gönder — Ücretsiz
            </button>
        </div>
    </div>`;
}

// ─── Sefer Bedeli Komisyon Hesaplama ─────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    document.addEventListener('input', function(e) {
        if (e.target && e.target.id === 'seferBedeli') {
            const b = parseFloat(e.target.value) || 0;
            const k = b > 0 ? Math.max(252, Math.round(b * 0.01)) : 252;
            const el = document.getElementById('ildKomisyon');
            if (el) el.innerHTML = b > 0
                ? `Platform komisyonu: <strong style="color:#f97316">${k.toLocaleString('tr-TR')} ₺</strong>/taraf`
                : "Platform komisyonu her taraftan: min. 252 ₺ veya bedelin %1'i";
        }
    });
});

// ─── Teklif Submit ────────────────────────────────────────────────────────
async function submitTeklif() {
    const fiyat = document.getElementById('teklifFiyat')?.value;
    const arac  = document.getElementById('teklifArac')?.value;
    const mesaj = document.getElementById('teklifMesaj')?.value;
    const seferBedeli = parseFloat(document.getElementById('seferBedeli')?.value) || 0;
    const komisyon = Math.max(252, Math.round(seferBedeli * 0.01));

    if (!fiyat || parseFloat(fiyat) < 1) { showToast('Geçerli bir fiyat girin.', 'error'); return; }

    const token = localStorage.getItem('accessToken');
    if (!token) { window.location.href = '/giris.html?redirect=' + encodeURIComponent(window.location.href); return; }

    const btn = document.getElementById('teklifSubmit');
    btn.disabled = true;
    btn.textContent = 'Gönderiliyor...';

    try {
        const r = await fetch('/api/teklifler', {
            method: 'POST',
            headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${token}` },
            body: JSON.stringify({
                ilan_id: ilan.id,
                fiyat: parseFloat(fiyat),
                mesaj,
                arac_bilgisi: arac,
                sefer_bedeli: seferBedeli || null,
                komisyon: komisyon,
            }),
        });
        const d = await r.json();

        if (!r.ok) { showToast(d.hata || 'Teklif gönderilemedi.', 'error'); return; }

        showToast('🎉 Teklif gönderildi! İş sahibi SMS ile bilgilendirildi.', 'success');
        document.getElementById('teklifVerCard').innerHTML = `
            <div class="card-label">✅ Teklif Gönderildi!</div>
            <div class="empty-state">
                <div class="e-icon">🎉</div>
                <p>Teklifiniz iletildi. İş sahibi kabul ederse SMS bildirimi alacaksınız.</p>
            </div>`;
    } catch { showToast('Bağlantı hatası.', 'error'); }
    finally { btn.disabled = false; btn.textContent = '🚛 Teklif Gönder — Ücretsiz'; }
}

// ─── İşi Ver Akışı ───────────────────────────────────────────────────────
async function isiVer(teklifId, suruciAd, fiyat) {
    selectedTeklifId = teklifId;

    // Onay dialog (basit)
    const ok = confirm(`"${suruciAd}" tırcısına işi vermek istiyor musunuz?\n\nFiyat: ${parseFloat(fiyat).toLocaleString('tr-TR')} ₺/ton\n\nDEVAM EDERSENİZ:\n→ 252 ₺ platform ücreti ödemeniz gerekecek\n→ Tırcı SMS ile bilgilendirilecek\n→ Tırcı da ödeme yapınca numaralarınız paylaşılacak`);
    if (!ok) return;

    // Ödeme sayfasına yönlendir
    const baslik = encodeURIComponent(ilan.baslik || 'Hafriyat İşi');
    const rota   = encodeURIComponent(`${ilan.konum_dan} → ${ilan.konum_a}`);
    window.location.href = `/odeme.html?tip=musteri&id=${teklifId}&baslik=${baslik}&rota=${rota}`;
}

// ─── Yardımcılar ─────────────────────────────────────────────────────────
function scrollToForm() {
    document.getElementById('teklifVerCard')?.scrollIntoView({ behavior:'smooth', block:'start' });
}

function showError() {
    document.getElementById('pageContent').innerHTML = `
        <div class="loading-card" style="flex-direction:column;grid-column:1/-1;">
            <div style="font-size:3rem;">😕</div>
            <p style="color:var(--muted);">İlan bulunamadı veya kaldırılmış.</p>
            <a href="/ilanlar.html" style="color:var(--orange);margin-top:12px;">← İlanlara Dön</a>
        </div>`;
}

function showToast(msg, type='success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `show ${type}`;
    setTimeout(() => el.className = '', 3500);
}
</script>
</body>
